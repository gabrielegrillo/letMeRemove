name: PowerShell checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest and run offline regression tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Test-ModuleManifest ./src/LetMeRemove.psd1 | Out-Null
          ./tests/Run-Tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify real terminal interruption (Linux and macOS)
        if: runner.os != 'Windows'
        run: |
          python3 tests/Test-CtrlC.py
          python3 tests/Test-ExistingShell.py
